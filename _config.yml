title: Blog
description: 工程笔记与模型观察
author: felixzhang-glitch
markdown: kramdown
theme: minima

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# 分页：GitHub Pages 只是把 jekyll-paginate 放进了白名单，仍需在此显式声明才会生效
# 未声明时 paginator 为 nil，_layouts/home.html 会回退到 site.posts，分页静默失效
plugins:
  - jekyll-paginate

paginate: 6
paginate_path: "/page:num/"

# 首页列表显示摘要
show_excerpts: true

# 页头导航（按路径匹配 site.pages）
header_pages:
  - tags.html
  - categories.html