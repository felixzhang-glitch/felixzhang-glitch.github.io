title: Blog
description: 工程笔记与模型观察
author: felixzhang-glitch
markdown: kramdown
theme: minima

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# 文章改用自定义 collection，文件名无需日期前缀
collections:
  articles:
    output: true
    permalink: /:name/

# jekyll-feed 默认只收录 posts，这里让它收录 articles
feed:
  collections:
    - articles

# 首页列表显示摘要
show_excerpts: true

# 页头导航（按路径匹配 site.pages）
header_pages:
  - tags.html
  - categories.html